name: Postilla reproducible staging build check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postilla-reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Clean signed build — builder ${{ matrix.builder }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        builder: [one, two]
    env:
      KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_KEY_PASSWORD }}

    steps:
      - name: Check required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode permanent signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/postilla-reproducibility.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          unset KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD

      - name: Build staging APK from clean workspace
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-build-cache --max-workers=2 clean assembleStaging \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --stacktrace
          VERSION_NAME="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          APK="app/build/outputs/apk/staging/app-staging.apk"
          test -s "$APK"
          mkdir -p reproducibility-output
          cp "$APK" "reproducibility-output/Postilla-Preview-v$VERSION_NAME.apk"
          sha256sum "reproducibility-output/Postilla-Preview-v$VERSION_NAME.apk" | tee reproducibility-output/SHA256SUMS

      - name: Upload APK and digest
        uses: actions/upload-artifact@v4
        with:
          name: postilla-reproducibility-${{ matrix.builder }}
          path: reproducibility-output/
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare independent clean builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download builder one
        uses: actions/download-artifact@v4
        with:
          name: postilla-reproducibility-one
          path: build-one

      - name: Download builder two
        uses: actions/download-artifact@v4
        with:
          name: postilla-reproducibility-two
          path: build-two

      - name: Compare APK bytes
        shell: bash
        run: |
          set -euo pipefail
          APK_ONE="$(find build-one -maxdepth 1 -name '*.apk' -print -quit)"
          APK_TWO="$(find build-two -maxdepth 1 -name '*.apk' -print -quit)"
          test -s "$APK_ONE"
          test -s "$APK_TWO"
          sha256sum "$APK_ONE" "$APK_TWO"
          cmp --silent "$APK_ONE" "$APK_TWO" || {
            echo "::error::The two clean staging APK builds are not byte-for-byte identical."
            exit 1
          }
          echo "Both independent clean builds are byte-for-byte identical."
