name: Postilla staging validation

on:
  push:
    branches:
      - "integration/postilla-mainline-20261120"
      - "staging/**"
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: postilla-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and verify signed Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_KEY_PASSWORD }}
      BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}

    steps:
      - name: Check required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$KEYSTORE_B64" ]] && missing+=("DARK_WISP_ENHANCED_KEYSTORE_BASE64")
          [[ -z "$STORE_PASSWORD" ]] && missing+=("DARK_WISP_ENHANCED_STORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && missing+=("DARK_WISP_ENHANCED_KEY_ALIAS")
          [[ -z "$KEY_PASSWORD" ]] && missing+=("DARK_WISP_ENHANCED_KEY_PASSWORD")
          [[ -z "$BREEZ_API_KEY" ]] && missing+=("BREEZ_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required permanent signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Validate Breez API key certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BREEZ_API_KEY" || {
            echo "::error::Repository secret BREEZ_API_KEY is missing."
            exit 1
          }
          CERT_PATH="$RUNNER_TEMP/breez-api-key.der"
          printf '%s' "$BREEZ_API_KEY" | base64 --decode > "$CERT_PATH"
          test -s "$CERT_PATH"
          ISSUER="$(openssl x509 -inform DER -in "$CERT_PATH" -noout -issuer -nameopt RFC2253)"
          printf '%s\n' "$ISSUER" | grep -Eq '(^|[=,])CN=Breez([^,]*)($|,)' || {
            echo "::error::BREEZ_API_KEY is not a Breez-issued DER certificate."
            exit 1
          }
          echo "Breez API key certificate validated."
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found below $SDK_ROOT"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Postilla signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/postilla-staging.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          unset KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD

      - name: Read expected version from Gradle
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Expected Postilla version: $VERSION_NAME ($VERSION_CODE)"

      - name: Run staging unit tests
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            testStagingUnitTest --stacktrace

      - name: Build signed staging APK
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            assembleStaging --stacktrace

      - name: Verify staging package, version and permanent certificate
        shell: bash
        env:
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/staging/app-staging.apk"
          test -s "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -x "$APKANALYZER"
          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          [[ "$PACKAGE_ID" == "com.isolabellart.darkwispenhanced.staging" ]]
          [[ "$VERSION_NAME" == "$EXPECTED_VERSION_NAME" ]]
          [[ "$VERSION_CODE" == "$EXPECTED_VERSION_CODE" ]]

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE_OUTPUT" | tee "$RUNNER_TEMP/staging-apk-signature.txt"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" \
            | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' \
            | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="86868a3659729a6531f3e8a31d5dcfe04405e2a86866f3e0eb0abb6965cdb841"
          [[ "$ACTUAL_CERT_SHA256" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "::error::Staging certificate mismatch."
            exit 1
          }

          cp "$APK" "Postilla-Preview-v$EXPECTED_VERSION_NAME.apk"
          sha256sum "Postilla-Preview-v$EXPECTED_VERSION_NAME.apk" | tee "$RUNNER_TEMP/postilla-staging-sha256.txt"

      - name: Attest staging APK build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: Postilla-Preview-v${{ steps.version.outputs.name }}.apk

      - name: Upload signed staging APK
        uses: actions/upload-artifact@v4
        with:
          name: postilla-staging-${{ steps.version.outputs.name }}
          path: Postilla-Preview-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 90
