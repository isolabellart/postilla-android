name: Publish Postilla release to Zapstore

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: zapstore-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish release
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Zapstore CLI
        shell: bash
        run: |
          go install github.com/zapstore/zsp/v2/cmd/zsp@v2.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/zsp" -v

      - name: Fetch pinned zsp source for NIP-46 identity verification
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.0.1 https://github.com/zapstore/zsp.git "$RUNNER_TEMP/zsp"

      - name: Verify release metadata and APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Unexpected release tag: $RELEASE_TAG"
            exit 1
          }
          echo "Zapstore source release: $RELEASE_URL"
          echo "Release tag: $RELEASE_TAG"
          zsp check zapstore.yaml

      - name: Verify Postilla bunker identity and publish to Zapstore
        shell: bash
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          BUNKER_CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_BUNKER_PUBKEY="8af9683c5868749cc3a261a0e006f3f53e4bea0aa81f31f0f027d684e7f0c0c8"

          if [[ -z "$SIGN_WITH" || "$SIGN_WITH" != bunker://* ]]; then
            echo "::error::Missing or invalid ZAPSTORE_SIGN_WITH bunker URL."
            exit 1
          fi
          if [[ ! "$BUNKER_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Missing or invalid ZAPSTORE_BUNKER_CLIENT_KEY (expected 64 hexadecimal characters)."
            exit 1
          fi

          # The bunker URL host identifies the remote signer, not the
          # delegated Nostr account returned by NIP-46 get_public_key.
          BUNKER_TARGET="${SIGN_WITH#bunker://}"
          BUNKER_TARGET="${BUNKER_TARGET%%\?*}"
          BUNKER_TARGET="${BUNKER_TARGET,,}"
          if [[ ! "$BUNKER_TARGET" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The bunker URL does not contain a valid hex remote-signer public key."
            exit 1
          fi

          # zsp persists a per-bunker NIP-46 client key on disk. Restore the
          # dedicated key from GitHub Secrets on every ephemeral runner.
          install -d -m 700 "$HOME/.config/zsp/bunker-keys"
          printf '%s\n' "$BUNKER_CLIENT_KEY" > "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          chmod 600 "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          unset BUNKER_CLIENT_KEY

          mkdir -p "$RUNNER_TEMP/zsp/.ci-bunker-check"
          cat > "$RUNNER_TEMP/zsp/.ci-bunker-check/main.go" <<'GO'
          package main

          import (
            "context"
            "fmt"
            "os"
            "time"

            zspnostr "github.com/zapstore/zsp/v2/internal/nostr"
          )

          func main() {
            ctx, cancel := context.WithTimeout(context.Background(), 60*time.Second)
            defer cancel()

            signer, err := zspnostr.NewSigner(ctx, os.Getenv("SIGN_WITH"))
            if err != nil {
              fmt.Fprintln(os.Stderr, "NIP-46 connection failed:", err)
              os.Exit(1)
            }
            defer signer.Close()

            const expected = "8af9683c5868749cc3a261a0e006f3f53e4bea0aa81f31f0f027d684e7f0c0c8"
            if signer.PublicKey() != expected {
              fmt.Fprintln(os.Stderr, "The bunker returned an unexpected signing identity.")
              os.Exit(1)
            }

            fmt.Println("NIP-46 handshake successful. Postilla delegate identity verified.")
          }
          GO

          # Do not invoke the publishing CLI unless the actual NIP-46
          # signing identity has been verified against the Postilla delegate.
          cd "$RUNNER_TEMP/zsp"
          go run ./.ci-bunker-check
          cd "$GITHUB_WORKSPACE"

          echo "Bunker identity verified; starting Zapstore publication."
          zsp publish -q zapstore.yaml
