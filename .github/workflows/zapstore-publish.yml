name: Publish and verify Postilla release on Zapstore

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact published stable GitHub release tag (for example v1.0.34)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zapstore-publish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    name: Publish exact GitHub release and verify Zapstore catalog
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up the tested Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install pinned Zapstore CLI
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/zapstore/zsp/v2/cmd/zsp@v2.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/zsp" --version

      - name: Fetch pinned zsp source for NIP-46 identity verification
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.0.1 https://github.com/zapstore/zsp.git "$RUNNER_TEMP/zsp"

      - name: Validate the exact GitHub release and prepare a targeted Zapstore config
        id: preflight
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a stable semantic release tag such as v1.0.34."
            exit 1
          }

          RELEASE_DATA="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          API_TAG="$(jq -r '.tag_name' <<< "$RELEASE_DATA")"
          IS_DRAFT="$(jq -r '.draft' <<< "$RELEASE_DATA")"
          IS_PRERELEASE="$(jq -r '.prerelease' <<< "$RELEASE_DATA")"
          RELEASE_URL="$(jq -r '.html_url' <<< "$RELEASE_DATA")"
          PUBLISHED_AT="$(jq -r '.published_at' <<< "$RELEASE_DATA")"

          [[ "$API_TAG" == "$RELEASE_TAG" && "$IS_DRAFT" == "false" && "$IS_PRERELEASE" == "false" ]] || {
            echo "::error::The requested tag is not an already-published stable GitHub release."
            exit 1
          }

          EXPECTED_APK_NAME="Postilla-${RELEASE_TAG}.apk"
          ASSET_DATA="$(jq -c --arg expected "$EXPECTED_APK_NAME" '.assets[]? | select(.name == $expected and .state == "uploaded")' <<< "$RELEASE_DATA")"
          [[ -n "$ASSET_DATA" ]] || {
            echo "::error::The exact signed APK asset is missing from the GitHub release: $EXPECTED_APK_NAME"
            exit 1
          }

          echo "GitHub release: $RELEASE_URL"
          echo "Published at: $PUBLISHED_AT"
          echo "Verified asset: $EXPECTED_APK_NAME"

          # Restrict zsp to this exact release. Keep the temporary file in the
          # repository root so relative Fastlane screenshot paths still work.
          python3 - "$RELEASE_TAG" "$GITHUB_WORKSPACE/zapstore.yaml" "$GITHUB_WORKSPACE/.zapstore-targeted.yaml" <<'PY'
          import pathlib
          import re
          import sys

          tag, source_path, target_path = sys.argv[1:]
          source = pathlib.Path(source_path).read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^release_filter:\s*.*$",
              "release_filter: '^" + re.escape(tag) + "$'",
              source,
          )
          if count != 1:
              raise SystemExit("Expected exactly one release_filter in zapstore.yaml")
          pathlib.Path(target_path).write_text(updated, encoding="utf-8")
          print("Prepared exact release filter for " + tag)
          PY

          zsp --json check "$GITHUB_WORKSPACE/.zapstore-targeted.yaml" > "$RUNNER_TEMP/zsp-preflight.json"
          cat "$RUNNER_TEMP/zsp-preflight.json"

          RELEASE_VERSION="${RELEASE_TAG#v}"
          jq -e \
            --arg app "com.isolabellart.darkwispenhanced" \
            --arg version "$RELEASE_VERSION" \
            --arg cert "86868a3659729a6531f3e8a31d5dcfe04405e2a86866f3e0eb0abb6965cdb841" \
            '.ok == true and .listed == true and
             .apk.app_id == $app and .apk.version_name == $version and
             (.apk.version_code | type == "number" and . > 0) and
             .apk.certificate_hash == $cert and
             (.apk.hash | type == "string" and test("^[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/zsp-preflight.json" >/dev/null || {
              echo "::error::Zapstore preflight failed: package, version, APK hash or permanent signing certificate mismatch."
              exit 1
            }

          VERSION_CODE="$(jq -r '.apk.version_code' "$RUNNER_TEMP/zsp-preflight.json")"
          APK_HASH="$(jq -r '.apk.hash' "$RUNNER_TEMP/zsp-preflight.json")"
          CERTIFICATE_HASH="$(jq -r '.apk.certificate_hash' "$RUNNER_TEMP/zsp-preflight.json")"
          PUBLISHED_VERSION_CODE="$(jq -r '.published_version_code // 0' "$RUNNER_TEMP/zsp-preflight.json")"

          if (( PUBLISHED_VERSION_CODE > VERSION_CODE )); then
            echo "::error::Zapstore already lists a newer version ($PUBLISHED_VERSION_CODE); refusing to publish an older release."
            exit 1
          elif (( PUBLISHED_VERSION_CODE == VERSION_CODE )); then
            echo "This exact version is already listed by Zapstore. The publish step will be skipped (idempotent retry)."
            SHOULD_PUBLISH=false
          else
            SHOULD_PUBLISH=true
          fi

          {
            echo "version_code=$VERSION_CODE"
            echo "apk_hash=$APK_HASH"
            echo "certificate_hash=$CERTIFICATE_HASH"
            echo "should_publish=$SHOULD_PUBLISH"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Zapstore release preflight"
            echo "- GitHub release: $RELEASE_URL"
            echo "- Version: $RELEASE_VERSION ($VERSION_CODE)"
            echo "- APK SHA-256: $APK_HASH"
            echo "- Signing certificate SHA-256: $CERTIFICATE_HASH"
            echo "- Previously indexed version code: $PUBLISHED_VERSION_CODE"
            echo "- Publish required: $SHOULD_PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Postilla Bunker identity with a real NIP-46 handshake
        if: steps.preflight.outputs.should_publish == 'true'
        shell: bash
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          BUNKER_CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
        run: |
          set -euo pipefail
          EXPECTED_DELEGATE_PUBKEY="8af9683c5868749cc3a261a0e006f3f53e4bea0aa81f31f0f027d684e7f0c0c8"

          if [[ -z "$SIGN_WITH" || "$SIGN_WITH" != bunker://* ]]; then
            echo "::error::Missing or invalid ZAPSTORE_SIGN_WITH bunker URL."
            exit 1
          fi
          if [[ ! "$BUNKER_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Missing or invalid ZAPSTORE_BUNKER_CLIENT_KEY (expected 64 hexadecimal characters)."
            exit 1
          fi

          # The bunker URL host is the remote signer key. It is NOT the
          # delegated account key returned by NIP-46 get_public_key.
          BUNKER_TARGET="${SIGN_WITH#bunker://}"
          BUNKER_TARGET="${BUNKER_TARGET%%\?*}"
          BUNKER_TARGET="${BUNKER_TARGET,,}"
          if [[ ! "$BUNKER_TARGET" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The bunker URL does not contain a valid remote-signer public key."
            exit 1
          fi

          install -d -m 700 "$HOME/.config/zsp/bunker-keys"
          printf '%s\n' "$BUNKER_CLIENT_KEY" > "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          chmod 600 "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          unset BUNKER_CLIENT_KEY

          mkdir -p "$RUNNER_TEMP/zsp/.ci-bunker-check"
          cat > "$RUNNER_TEMP/zsp/.ci-bunker-check/main.go" <<'GO'
          package main

          import (
            "context"
            "fmt"
            "os"
            "time"

            zspnostr "github.com/zapstore/zsp/v2/internal/nostr"
          )

          func main() {
            ctx, cancel := context.WithTimeout(context.Background(), 60*time.Second)
            defer cancel()

            signer, err := zspnostr.NewSigner(ctx, os.Getenv("SIGN_WITH"))
            if err != nil {
              fmt.Fprintln(os.Stderr, "NIP-46 connection failed:", err)
              os.Exit(1)
            }
            defer signer.Close()

            const expected = "8af9683c5868749cc3a261a0e006f3f53e4bea0aa81f31f0f027d684e7f0c0c8"
            if signer.PublicKey() != expected {
              fmt.Fprintln(os.Stderr, "The bunker returned an unexpected delegated signing identity.")
              os.Exit(1)
            }
            fmt.Println("NIP-46 handshake successful. Postilla delegate identity verified.")
          }
          GO

          cd "$RUNNER_TEMP/zsp"
          go run ./.ci-bunker-check

      - name: Publish the exact release to Zapstore
        if: steps.preflight.outputs.should_publish == 'true'
        shell: bash
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Publishing the exact preflight-verified release to Zapstore."
          zsp publish -q "$GITHUB_WORKSPACE/.zapstore-targeted.yaml"

      - name: Verify the version is actually indexed by Zapstore
        id: postpublish
        shell: bash
        env:
          VERSION_CODE: ${{ steps.preflight.outputs.version_code }}
          APK_HASH: ${{ steps.preflight.outputs.apk_hash }}
          CERTIFICATE_HASH: ${{ steps.preflight.outputs.certificate_hash }}
          SHOULD_PUBLISH: ${{ steps.preflight.outputs.should_publish }}
        run: |
          set -euo pipefail
          CHECK_JSON="$RUNNER_TEMP/zsp-postpublish.json"
          CHECK_STDERR="$RUNNER_TEMP/zsp-postpublish.stderr"
          ZSP="$(go env GOPATH)/bin/zsp"

          # A previous successful publish is accepted only after the same
          # exact APK and signing certificate have been confirmed by zsp.
          for attempt in $(seq 1 20); do
            set +e
            "$ZSP" --json check "$GITHUB_WORKSPACE/.zapstore-targeted.yaml" > "$CHECK_JSON" 2> "$CHECK_STDERR"
            CHECK_RC=$?
            set -e

            if (( CHECK_RC == 0 )) && jq -e \
              --argjson code "$VERSION_CODE" \
              --arg hash "$APK_HASH" \
              --arg cert "$CERTIFICATE_HASH" \
              '.ok == true and .listed == true and
               .apk.app_id == "com.isolabellart.darkwispenhanced" and
               .apk.version_code == $code and
               .apk.hash == $hash and
               .apk.certificate_hash == $cert and
               .published_version_code == $code' \
              "$CHECK_JSON" >/dev/null; then
                echo "Zapstore catalog confirms version code $VERSION_CODE and the exact verified APK."
                cat "$CHECK_JSON"
                {
                  echo "## Zapstore publication verified"
                  echo "- Published version code: $VERSION_CODE"
                  echo "- APK SHA-256: $APK_HASH"
                  echo "- Signing certificate SHA-256: $CERTIFICATE_HASH"
                  echo "- Catalog check attempts: $attempt"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
            fi

            echo "Zapstore has not indexed version code $VERSION_CODE yet (check $attempt/20)."
            if [[ -s "$CHECK_JSON" ]]; then cat "$CHECK_JSON"; fi
            if [[ -s "$CHECK_STDERR" ]]; then cat "$CHECK_STDERR"; fi
            if (( attempt < 20 )); then sleep 30; fi
          done

          {
            echo "## Zapstore publication requires attention"
            echo "The publish command completed, but the catalog did not confirm version code $VERSION_CODE within 10 minutes."
            echo "Inspect the attached diagnostic artifact before deciding whether a manual retry is needed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Zapstore catalog did not confirm the exact release within 10 minutes."
          exit 1

      - name: Preserve Zapstore preflight and catalog diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zapstore-release-diagnostics
          path: |
            ${{ runner.temp }}/zsp-preflight.json
            ${{ runner.temp }}/zsp-postpublish.json
            ${{ runner.temp }}/zsp-postpublish.stderr
          if-no-files-found: warn
          retention-days: 30
