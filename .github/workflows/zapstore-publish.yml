name: Publish Postilla release to Zapstore

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: zapstore-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish release
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Zapstore CLI
        shell: bash
        run: |
          go install github.com/zapstore/zsp/v2/cmd/zsp@v2.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/zsp" -v

      - name: Verify release metadata and APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Unexpected release tag: $RELEASE_TAG"
            exit 1
          }
          echo "Zapstore source release: $RELEASE_URL"
          echo "Release tag: $RELEASE_TAG"
          zsp check zapstore.yaml

      - name: Publish to Zapstore
        shell: bash
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          BUNKER_CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_BUNKER_PUBKEY: 8af9683c5868749cc3a261a0e006f3f53e4bea0aa81f31f0f027d684e7f0c0c8
        run: |
          set -euo pipefail
          if [[ -z "$SIGN_WITH" ]]; then
            echo "::error::Missing GitHub Actions secret ZAPSTORE_SIGN_WITH."
            exit 1
          fi
          if [[ "$SIGN_WITH" != bunker://* ]]; then
            echo "::error::ZAPSTORE_SIGN_WITH must contain the dedicated Postilla delegate bunker URL."
            exit 1
          fi
          if [[ ! "$BUNKER_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Missing or invalid GitHub Actions secret ZAPSTORE_BUNKER_CLIENT_KEY (expected 64 hexadecimal characters)."
            exit 1
          fi

          BUNKER_TARGET="${SIGN_WITH#bunker://}"
          BUNKER_TARGET="${BUNKER_TARGET%%\?*}"
          if [[ ! "$BUNKER_TARGET" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The configured bunker URL has an invalid target public key."
            exit 1
          fi

          if [[ "${BUNKER_TARGET,,}" != "$EXPECTED_BUNKER_PUBKEY" ]]; then
            echo "::error::The configured bunker does not belong to the expected Postilla delegate identity."
            exit 1
          fi

          # zsp persists a per-bunker NIP-46 client key on disk. Restore the
          # same dedicated key from GitHub Secrets on every ephemeral runner.
          install -d -m 700 "$HOME/.config/zsp/bunker-keys"
          printf '%s\n' "$BUNKER_CLIENT_KEY" > "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          chmod 600 "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          unset BUNKER_CLIENT_KEY

          zsp publish -q zapstore.yaml
