name: Postilla v1.0.33 official release

on:
  push:
    branches:
      - "release/postilla-v1.0.33"

permissions:
  contents: write

concurrency:
  group: postilla-v1.0.33-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, verify and publish Postilla v1.0.33
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch and approved staging source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release/postilla-v1.0.33" ]]
          TESTED_STAGING_COMMIT="97136305d62b211b66a21844f742332f2fbbed3e"
          PREVIOUS_RELEASE_COMMIT="57503656e090710b7162faba87056f1cedfd9db7"
          git merge-base --is-ancestor "$PREVIOUS_RELEASE_COMMIT" HEAD
          git merge-base --is-ancestor "$TESTED_STAGING_COMMIT" HEAD
          git diff --quiet "$TESTED_STAGING_COMMIT" HEAD -- . ':(exclude).github/workflows/postilla-v1.0.33-release.yml' ':(exclude)zapstore.yaml'
          echo "Verified v1.0.25 base and the exact user-approved, CI-green Postilla 1.0.33 application source."
          echo "Release source: $(git rev-parse HEAD)"
          if [[ -n "$(git ls-remote --tags origin refs/tags/v1.0.33)" ]]; then
            echo "::error::Tag v1.0.33 already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Check permanent signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$KEYSTORE_B64" ]] && missing+=("DARK_WISP_ENHANCED_KEYSTORE_BASE64")
          [[ -z "$STORE_PASSWORD" ]] && missing+=("DARK_WISP_ENHANCED_STORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && missing+=("DARK_WISP_ENHANCED_KEY_ALIAS")
          [[ -z "$KEY_PASSWORD" ]] && missing+=("DARK_WISP_ENHANCED_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required permanent signing secrets: ${missing[*]}"
            exit 1
          fi
          if [[ -z "${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}" ]]; then
            echo "::error::Missing DARK_WISP_ENHANCED_RELEASE_TOKEN."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode permanent Postilla signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/postilla-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run staging unit tests
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            testStagingUnitTest --stacktrace

      - name: Build signed production APK
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            assembleRelease --stacktrace

      - name: Verify production package, version and permanent signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -x "$APKANALYZER"
          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          echo "Package: $PACKAGE_ID"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          [[ "$PACKAGE_ID" == "com.isolabellart.darkwispenhanced" ]]
          [[ "$VERSION_NAME" == "1.0.33" ]]
          [[ "$VERSION_CODE" == "33" ]]

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE_OUTPUT" | tee "$RUNNER_TEMP/postilla-release-signature.txt"
          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "$SIGNATURE_OUTPUT" \
              | awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' \
              | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED_CERT_SHA256="86868a3659729a6531f3e8a31d5dcfe04405e2a86866f3e0eb0abb6965cdb841"
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK certificate mismatch. Expected $EXPECTED_CERT_SHA256, got ${ACTUAL_CERT_SHA256:-<missing>}."
            exit 1
          fi

          cp "$APK" "Postilla-v1.0.33.apk"
          sha256sum "Postilla-v1.0.33.apk" | tee "$RUNNER_TEMP/postilla-v1.0.33-sha256.txt"

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: postilla-v1.0.33-signed-apk
          path: Postilla-v1.0.33.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove stale draft from previous failed validation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "v1.0.33" and .draft == true) | .id')"
          while IFS= read -r RELEASE_ID; do
            [[ -n "$RELEASE_ID" ]] || continue
            echo "Removing stale draft release $RELEASE_ID before a fresh verified upload."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          done <<< "$RELEASE_IDS"

      # Publish as a draft first. The Zapstore workflow listens for the
      # published event, so the asset is attached before the release is public.
      - name: Create draft GitHub release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.33
          target_commitish: ${{ github.sha }}
          name: Postilla v1.0.33
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: false
          body: |
            ## What's new

            - A more comfortable note composer, with clearer text and improved spacing while writing.
            - More consistent identification of Postilla when publishing notes, reposts, replies and quick notification responses.
            - A tidier Marketplace presentation, with clearer seller details, easier horizontal browsing and more readable listing summaries and prices.
            - More consistent social interactions across the feed, likes, replies, notifications and reposts.
            - General stability and usability improvements.

            ## Compatibility

            - Android package: `com.isolabellart.darkwispenhanced`
            - Version: **1.0.33 (33)**
            - Existing installations and the permanent signing identity are preserved.

            ---

            ## Novità

            - Composizione delle note più confortevole, con testo più leggibile e spaziature migliorate durante la scrittura.
            - Identificazione di Postilla più coerente nella pubblicazione di note, repost, risposte e risposte rapide alle notifiche.
            - Presentazione del Marketplace più ordinata, con informazioni del venditore più chiare, navigazione orizzontale più semplice e riepiloghi e prezzi più leggibili.
            - Interazioni social più coerenti nel feed, tra like, risposte, notifiche e repost.
            - Migliorie generali di stabilità e usabilità.

            ## Compatibilità

            - Package Android: `com.isolabellart.darkwispenhanced`
            - Versione: **1.0.33 (33)**
            - Le installazioni esistenti e l'identità di firma permanente vengono mantenute.
          files: Postilla-v1.0.33.apk
          fail_on_unmatched_files: true
          overwrite_files: false
          token: ${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}

      - name: Verify uploaded asset and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "v1.0.33" and .draft == true) | .id' | tail -n 1)"
          test -n "$RELEASE_ID"
          EXPECTED_SHA256="$(sha256sum Postilla-v1.0.33.apk | awk '{print $1}')"
          RELEASE_DATA="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          ASSET_DATA="$(jq -c --arg name "Postilla-v1.0.33.apk" '.assets[] | select(.name == $name and .state == "uploaded")' <<< "$RELEASE_DATA")"
          [[ -n "$ASSET_DATA" ]] || {
            echo "::error::The signed APK is not attached to the draft release."
            exit 1
          }
          ASSET_SIZE="$(jq -r '.size' <<< "$ASSET_DATA")"
          ASSET_DIGEST="$(jq -r '.digest // empty' <<< "$ASSET_DATA")"
          (( ASSET_SIZE > 0 ))
          if [[ -n "$ASSET_DIGEST" && "$ASSET_DIGEST" != "sha256:$EXPECTED_SHA256" ]]; then
            echo "::error::Uploaded APK digest does not match the verified build."
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          echo "Postilla v1.0.33 is published with its verified APK asset."

      - name: Set up Go for Zapstore
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install pinned Zapstore CLI
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/zapstore/zsp/v2/cmd/zsp@v2.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/zsp" -v

      - name: Verify Postilla Zapstore delegate and publish
        shell: bash
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          BUNKER_CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_BUNKER_PUBKEY: 8af9683c5868749cc3a261a0e006f3f53e4bea0aa81f31f0f027d684e7f0c0c8
          RELEASE_TAG: v1.0.33
        run: |
          set -euo pipefail
          if [[ -z "$SIGN_WITH" || "$SIGN_WITH" != bunker://* ]]; then
            echo "::error::Missing or invalid ZAPSTORE_SIGN_WITH bunker URL."
            exit 1
          fi
          if [[ ! "$BUNKER_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Missing or invalid ZAPSTORE_BUNKER_CLIENT_KEY."
            exit 1
          fi

          BUNKER_TARGET="${SIGN_WITH#bunker://}"
          BUNKER_TARGET="${BUNKER_TARGET%%\?*}"
          if [[ "${BUNKER_TARGET,,}" != "$EXPECTED_BUNKER_PUBKEY" ]]; then
            echo "::error::The configured bunker is not the dedicated Postilla delegate."
            exit 1
          fi

          install -d -m 700 "$HOME/.config/zsp/bunker-keys"
          printf '%s\n' "$BUNKER_CLIENT_KEY" > "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          chmod 600 "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          unset BUNKER_CLIENT_KEY

          zsp check zapstore.yaml
          zsp publish -q zapstore.yaml

          echo "Zapstore publication completed for Postilla $RELEASE_TAG."
