name: Postilla release (manual, protected)

# Manual publication only. Build and certificate checks run before any release is created.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (defaults to the Gradle versionName)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: postilla-release
  cancel-in-progress: true

jobs:
  release:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Block releases outside the established release branch
        shell: bash
        run: |
          EXPECTED_RELEASE_BRANCH="release/postilla-v1.0.33"
          ACTUAL_REF="${GITHUB_REF#refs/heads/}"
          if [[ "$ACTUAL_REF" != "$EXPECTED_RELEASE_BRANCH" ]]; then
            echo "::error::Postilla releases are only permitted from $EXPECTED_RELEASE_BRANCH."
            exit 1
          fi

      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$KEYSTORE_B64" ]] && missing+=("DARK_WISP_ENHANCED_KEYSTORE_BASE64")
          [[ -z "$STORE_PASSWORD" ]] && missing+=("DARK_WISP_ENHANCED_STORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && missing+=("DARK_WISP_ENHANCED_KEY_ALIAS")
          [[ -z "$KEY_PASSWORD" ]] && missing+=("DARK_WISP_ENHANCED_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::notice title=Signing not configured::Add repository Actions secrets: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped release
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo "No APK was built or published."
          echo "Configure the four Postilla signing secrets, then push a new commit to this branch."

      - name: Check release publishing permission
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::Add repository secret DARK_WISP_ENHANCED_RELEASE_TOKEN with a fine-grained PAT limited to this repository and Contents: Read and write plus Workflows: Read and write."
            exit 1
          fi

      - name: Check out source
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.signing.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/dark-wisp-enhanced-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Compile the staging test variant and release variant in separate Gradle
      # invocations. Running both Kotlin compilations in one task graph caused
      # the Kotlin daemon to exhaust its heap while compiling the Compose sources.
      # The signed staging build #119 (run 43222425438) passed on the exact
      # application source and was manually validated on device. Manual
      # dispatches still re-run unit tests before compiling the production APK.
      - name: Run staging unit tests
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            testStagingUnitTest --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            assembleRelease --stacktrace

      - name: Verify APK signature and certificate
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -x "$APKANALYZER"
          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          echo "Package: $PACKAGE_ID"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          EXPECTED_VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          EXPECTED_VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$EXPECTED_VERSION_NAME"
          test -n "$EXPECTED_VERSION_CODE"
          [[ "$PACKAGE_ID" == "com.isolabellart.darkwispenhanced" ]]
          [[ "$VERSION_NAME" == "$EXPECTED_VERSION_NAME" ]]
          [[ "$VERSION_CODE" == "$EXPECTED_VERSION_CODE" ]]

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE_OUTPUT" | tee "$RUNNER_TEMP/apk-signature.txt"

          # apksigner labels the signer differently across build-tools versions
          # and prints the fingerprint without colon separators. Normalize both
          # values before comparing so formatting cannot cause a false failure.
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" \
            | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' \
            | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="86868a3659729a6531f3e8a31d5dcfe04405e2a86866f3e0eb0abb6965cdb841"
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK certificate mismatch. Expected $EXPECTED_CERT_SHA256, got ${ACTUAL_CERT_SHA256:-<missing>}."
            exit 1
          fi

          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Determine release metadata
        if: steps.signing.outputs.ready == 'true'
        id: release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          TAG="$RELEASE_TAG_INPUT"
          [[ -n "$TAG" ]] || TAG="v$VERSION_NAME"
          if [[ "$TAG" != "v$VERSION_NAME" ]]; then
            echo "::error::This workflow is prepared for v$VERSION_NAME only; received $TAG."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # This release path creates stable releases only; stable publication is mirrored to Zapstore.

      - name: Prepare Zapstore-compatible APK filename
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          TARGET="app/build/outputs/apk/release/Postilla-${RELEASE_TAG}.apk"
          cp "$SOURCE" "$TARGET"
          test -s "$TARGET"

      - name: Upload signed APK as workflow artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: postilla-${{ steps.release.outputs.tag }}
          path: app/build/outputs/apk/release/Postilla-${{ steps.release.outputs.tag }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/Postilla-${RELEASE_TAG}.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          # Postilla @@VERSION_NAME@@

          **A clearer, smoother experience for everyday Nostr conversations.**

          This update refines the way you write, browse and interact in Postilla.

          ## What's new
          - A more comfortable note composer, with clearer text and improved spacing while writing.
          - More consistent identification of Postilla when publishing notes, reposts, replies and quick notification responses.
          - A tidier Marketplace presentation, with clearer seller details, easier horizontal browsing and more readable listing summaries and prices.
          - More consistent social interactions across the feed, likes, replies, notifications and reposts.
          - General stability and usability improvements.

          Postilla keeps the existing Android app identity, so compatible installations can update without changing package identity. The app remains independently maintained and separate from upstream Dark Wisp.

          Package: com.isolabellart.darkwispenhanced
          Version: @@VERSION_NAME@@ (@@VERSION_CODE@@)
          Signed APK: Postilla-@@RELEASE_TAG@@.apk
          SHA-256: @@APK_SHA256@@

          ---

          # Postilla @@VERSION_NAME@@ (Italiano)

          **Un'esperienza più chiara e fluida per le conversazioni Nostr di ogni giorno.**

          Questo aggiornamento affina il modo in cui scrivi, esplori e interagisci con Postilla.

          ## Novità
          - Composizione delle note più confortevole, con testo più leggibile e spaziature migliorate durante la scrittura.
          - Identificazione di Postilla più coerente nella pubblicazione di note, repost, risposte e risposte rapide alle notifiche.
          - Presentazione del Marketplace più ordinata, con informazioni del venditore più chiare, navigazione orizzontale più semplice e riepiloghi e prezzi più leggibili.
          - Interazioni social più coerenti nel feed, tra like, risposte, notifiche e repost.
          - Migliorie generali di stabilità e usabilità.

          Postilla conserva l'identità Android esistente: le installazioni compatibili potranno aggiornarsi senza cambiare package. L'app continua a essere sviluppata in modo indipendente e resta separata da Dark Wisp upstream.

          Package: com.isolabellart.darkwispenhanced
          Versione: @@VERSION_NAME@@ (@@VERSION_CODE@@)
          APK firmato: Postilla-@@RELEASE_TAG@@.apk
          SHA-256: @@APK_SHA256@@
          EOF
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          sed -i "s|@@VERSION_NAME@@|$VERSION_NAME|g; s|@@VERSION_CODE@@|$VERSION_CODE|g; s|@@RELEASE_TAG@@|$RELEASE_TAG|g; s|@@APK_SHA256@@|$APK_SHA256|g" "$NOTES"
          gh release create "$RELEASE_TAG" "$APK#Postilla-${RELEASE_TAG}.apk" \
            --title "Postilla ${RELEASE_TAG}" \
            --target "$GITHUB_SHA" \
            --notes-file "$NOTES"
