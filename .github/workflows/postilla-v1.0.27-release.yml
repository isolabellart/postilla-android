name: Postilla v1.0.27 official release

on:
  push:
    branches:
      - "release/postilla-v1.0.27"

permissions:
  contents: write

concurrency:
  group: postilla-v1.0.27-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, verify and publish Postilla v1.0.27
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch and approved staging source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release/postilla-v1.0.27" ]]
          TESTED_STAGING_COMMIT="889db463a060c84a461824a65a0af0be8debbf26"
          PREVIOUS_RELEASE_COMMIT="57503656e090710b7162faba87056f1cedfd9db7"
          git merge-base --is-ancestor "$PREVIOUS_RELEASE_COMMIT" HEAD
          git merge-base --is-ancestor "$TESTED_STAGING_COMMIT" HEAD
          git diff --quiet "$TESTED_STAGING_COMMIT" HEAD -- . ':(exclude).github/workflows/postilla-v1.0.27-release.yml'
          echo "Verified v1.0.25 base and the exact user-approved, CI-green Postilla 1.0.27 application source."
          echo "Release source: $(git rev-parse HEAD)"
          if [[ -n "$(git ls-remote --tags origin refs/tags/v1.0.27)" ]]; then
            echo "::error::Tag v1.0.27 already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Check permanent signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$KEYSTORE_B64" ]] && missing+=("DARK_WISP_ENHANCED_KEYSTORE_BASE64")
          [[ -z "$STORE_PASSWORD" ]] && missing+=("DARK_WISP_ENHANCED_STORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && missing+=("DARK_WISP_ENHANCED_KEY_ALIAS")
          [[ -z "$KEY_PASSWORD" ]] && missing+=("DARK_WISP_ENHANCED_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required permanent signing secrets: ${missing[*]}"
            exit 1
          fi
          if [[ -z "${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}" ]]; then
            echo "::error::Missing DARK_WISP_ENHANCED_RELEASE_TOKEN."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode permanent Postilla signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/postilla-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run staging unit tests
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            testStagingUnitTest --stacktrace

      - name: Build signed production APK
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            assembleRelease --stacktrace

      - name: Verify production package, version and permanent signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -x "$APKANALYZER"
          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          echo "Package: $PACKAGE_ID"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          [[ "$PACKAGE_ID" == "com.isolabellart.darkwispenhanced" ]]
          [[ "$VERSION_NAME" == "1.0.27" ]]
          [[ "$VERSION_CODE" == "27" ]]

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE_OUTPUT" | tee "$RUNNER_TEMP/postilla-release-signature.txt"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" \
            | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' \
            | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="86868a3659729a6531f3e8a31d5dcfe04405e2a86866f3e0eb0abb6965cdb841"
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK certificate mismatch. Expected $EXPECTED_CERT_SHA256, got ${ACTUAL_CERT_SHA256:-<missing>}."
            exit 1
          fi

          cp "$APK" "Postilla-v1.0.27.apk"
          sha256sum "Postilla-v1.0.27.apk" | tee "$RUNNER_TEMP/postilla-v1.0.27-sha256.txt"

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: postilla-v1.0.27-signed-apk
          path: Postilla-v1.0.27.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove stale draft from previous failed validation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "v1.0.27" and .draft == true) | .id')"
          while IFS= read -r RELEASE_ID; do
            [[ -n "$RELEASE_ID" ]] || continue
            echo "Removing stale draft release $RELEASE_ID before a fresh verified upload."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          done <<< "$RELEASE_IDS"

      # Publish as a draft first. The Zapstore workflow listens for the
      # published event, so the asset is attached before the release is public.
      - name: Create draft GitHub release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.27
          target_commitish: ${{ github.sha }}
          name: Postilla v1.0.27
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: false
          body: |
            ## What's new

            - **NIP-15 to NIP-99 migration:** editing a legacy product (kind 30018) creates a modern NIP-99 listing (kind 30402), preserving listing data. The old event is withdrawn with NIP-09 only after at least one relay confirms publication of the new listing.
            - **Reliable Hidden visibility:** hidden listings remain available to their owner but are excluded from public Marketplace discovery and access paths.
            - **Clearer listing availability and type:** seller previews show distinct Hidden, Pre-order and On sale badges, with Digital or Physical type information.
            - **Hide sold works as expected:** sold listings are removed from the visible list when the filter is enabled and return when it is disabled, without deleting the listings.
            - **More dependable Marketplace editing:** legacy and NIP-99 listings can be opened for editing from previews and details, including coordinate-based and naddr entry points.
            - **Multiline listing summary:** the Summary field supports line breaks and grows vertically while editing, with the existing character limit made visible where applicable.
            - **NIP-09 cache consistency:** withdrawn addressable events are prevented from re-entering the in-memory cache through stale lookups.
            - Additional Marketplace status, editing and reliability refinements.

            ## Compatibility

            - Android package: `com.isolabellart.darkwispenhanced`
            - Version: **1.0.27 (27)**
            - Existing installations and the permanent signing identity are preserved.

            ---

            ## Novità

            - **Migrazione da NIP-15 a NIP-99:** modificando un vecchio prodotto (kind 30018) viene creato un nuovo annuncio NIP-99 (kind 30402), conservando i dati. Il vecchio evento viene ritirato con NIP-09 soltanto dopo la conferma di pubblicazione del nuovo annuncio da parte di almeno un relay.
            - **Visibilità Hidden affidabile:** gli annunci nascosti restano accessibili al proprietario, ma vengono esclusi dalla consultazione pubblica del Marketplace e dai relativi percorsi di accesso.
            - **Stati e tipologie più chiari:** le anteprime del venditore mostrano badge distinti per Hidden, Pre-order e On sale, oltre alla tipologia Digital o Physical.
            - **Hide sold corretto:** attivando il filtro, gli annunci venduti scompaiono dalla lista; disattivandolo ricompaiono, senza cancellare gli annunci.
            - **Modifica degli annunci più affidabile:** l'editor si apre per gli annunci legacy e NIP-99 dalla preview e dal dettaglio, anche tramite coordinate e naddr.
            - **Sommario su più righe:** il campo Sommario accetta interruzioni di riga e si espande verticalmente durante la modifica; il limite caratteri esistente viene mostrato quando previsto.
            - **Coerenza della cache NIP-09:** gli eventi addressable ritirati non vengono reinseriti nella cache in memoria da recuperi obsoleti.
            - Ulteriori miglioramenti agli stati, alla modifica degli annunci e all'affidabilità del Marketplace.

            ## Compatibilità

            - Package Android: `com.isolabellart.darkwispenhanced`
            - Versione: **1.0.27 (27)**
            - Le installazioni esistenti e l'identità di firma permanente vengono mantenute.
          files: Postilla-v1.0.27.apk
          fail_on_unmatched_files: true
          overwrite_files: false
          token: ${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}

      - name: Verify uploaded asset and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DARK_WISP_ENHANCED_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "v1.0.27" and .draft == true) | .id' | tail -n 1)"
          test -n "$RELEASE_ID"
          EXPECTED_SHA256="$(sha256sum Postilla-v1.0.27.apk | awk '{print $1}')"
          RELEASE_DATA="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          ASSET_DATA="$(jq -c --arg name "Postilla-v1.0.27.apk" '.assets[] | select(.name == $name and .state == "uploaded")' <<< "$RELEASE_DATA")"
          [[ -n "$ASSET_DATA" ]] || {
            echo "::error::The signed APK is not attached to the draft release."
            exit 1
          }
          ASSET_SIZE="$(jq -r '.size' <<< "$ASSET_DATA")"
          ASSET_DIGEST="$(jq -r '.digest // empty' <<< "$ASSET_DATA")"
          (( ASSET_SIZE > 0 ))
          if [[ -n "$ASSET_DIGEST" && "$ASSET_DIGEST" != "sha256:$EXPECTED_SHA256" ]]; then
            echo "::error::Uploaded APK digest does not match the verified build."
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=false -f make_latest=true >/dev/null
          echo "Postilla v1.0.27 is published with its verified APK asset."
