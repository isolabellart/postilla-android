name: Verify Postilla Zapstore bunker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zapstore-bunker-check
  cancel-in-progress: false

jobs:
  verify-bunker:
    name: Read-only NIP-46 connection check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Fetch pinned zsp source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.0.1 https://github.com/zapstore/zsp.git "$RUNNER_TEMP/zsp"

      - name: Connect to Postilla bunker and verify identity
        shell: bash
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          BUNKER_CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
          EXPECTED_BUNKER_PUBKEY: 8af9683c5868749cc3a261a0e006f3f53e4bea0aa81f31f0f027d684e7f0c0c8
        run: |
          set -euo pipefail
          if [[ -z "$SIGN_WITH" || "$SIGN_WITH" != bunker://* ]]; then
            echo "::error::Missing or invalid ZAPSTORE_SIGN_WITH bunker URL."
            exit 1
          fi
          if [[ ! "$BUNKER_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Missing or invalid ZAPSTORE_BUNKER_CLIENT_KEY."
            exit 1
          fi

          BUNKER_TARGET="${SIGN_WITH#bunker://}"
          BUNKER_TARGET="${BUNKER_TARGET%%\?*}"
          if [[ "${BUNKER_TARGET,,}" != "$EXPECTED_BUNKER_PUBKEY" ]]; then
            echo "::error::The configured bunker is not the Postilla delegate."
            exit 1
          fi

          install -d -m 700 "$HOME/.config/zsp/bunker-keys"
          printf '%s\n' "$BUNKER_CLIENT_KEY" > "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          chmod 600 "$HOME/.config/zsp/bunker-keys/$BUNKER_TARGET.key"
          unset BUNKER_CLIENT_KEY

          mkdir -p "$RUNNER_TEMP/zsp/.ci-bunker-check"
          cat > "$RUNNER_TEMP/zsp/.ci-bunker-check/main.go" <<'GO'
          package main

          import (
            "context"
            "fmt"
            "os"
            "time"

            zspnostr "github.com/zapstore/zsp/v2/internal/nostr"
          )

          func main() {
            ctx, cancel := context.WithTimeout(context.Background(), 40*time.Second)
            defer cancel()

            signer, err := zspnostr.NewSigner(ctx, os.Getenv("SIGN_WITH"))
            if err != nil {
              fmt.Fprintln(os.Stderr, "NIP-46 connection failed:", err)
              os.Exit(1)
            }
            defer signer.Close()

            const expected = "8af9683c5868749cc3a261a0e006f3f53e4bea0aa81f31f0f027d684e7f0c0c8"
            if signer.PublicKey() != expected {
              fmt.Fprintln(os.Stderr, "The bunker returned an unexpected signing identity.")
              os.Exit(1)
            }

            fmt.Println("NIP-46 handshake successful. Postilla delegate identity verified.")
            fmt.Println("No event was signed or published.")
          }
          GO

          cd "$RUNNER_TEMP/zsp"
          go run ./.ci-bunker-check
