name: Verify Android release keystore fingerprint

on:
  push:
    branches:
      - diagnostics/keystore-fingerprint-20261115

permissions:
  contents: read

jobs:
  verify-keystore:
    name: Verify release signing certificate
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify keystore fingerprint
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/postilla-release-check.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT

          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          CERT_INFO="$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>&1)" || {
              echo "::error::Unable to read the configured release keystore and alias."
              exit 1
            }

          ACTUAL="$(printf '%s\n' "$CERT_INFO" |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]')"

          EXPECTED="86868a3659729a6531f3e8a31d5dcfe04405e2a86866f3e0eb0abb6965cdb841"

          if [[ -z "$ACTUAL" ]]; then
            echo "::error::No SHA-256 certificate fingerprint was found."
            exit 1
          fi

          echo "Release certificate SHA-256: $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::The keystore certificate does not match the Postilla v1.0.17 signing certificate."
            exit 1
          fi

          echo "Verified: keystore matches the Postilla v1.0.17 signing certificate."
