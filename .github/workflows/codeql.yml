name: Postilla CodeQL security analysis

on:
  push:
    branches:
      - main
      - "staging/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # Gradle/Kotlin in this project is validated on JDK 17.
      # Keep CodeQL's bundled Java separate; explicitly select JDK 17 for Gradle.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle Java runtime
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Use the bounded Gradle configuration used by staging validation.
      # In-process Kotlin compilation avoids a second JVM exhausting runner memory.
      - name: Build for CodeQL
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            assembleDebug --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
