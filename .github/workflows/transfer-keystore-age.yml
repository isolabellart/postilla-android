name: Temporary encrypted Postilla keystore transfer

on:
  push:
    branches:
      - diagnostics/age-keystore-transfer-20261115

permissions:
  contents: read

jobs:
  encrypt-release-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Install age and decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DARK_WISP_ENHANCED_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DARK_WISP_ENHANCED_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARK_WISP_ENHANCED_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_B64" || { echo "Keystore secret is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Store password secret is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Key alias secret is missing"; exit 1; }

          sudo apt-get update -qq
          sudo apt-get install -y age

          KEYSTORE_PATH="$RUNNER_TEMP/postilla-release-keystore.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          ACTUAL_FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          EXPECTED_FINGERPRINT="86868a3659729a6531f3e8a31d5dcfe04405e2a86866f3e0eb0abb6965cdb841"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT" || {
            echo "Keystore certificate fingerprint mismatch; refusing transfer."
            exit 1
          }
          echo "Release certificate fingerprint verified."

          age -r age1q5hupqnasxc8jrj7gh4k5x3787rqx8jd2wqld3r02tjk2uqaye9qwuzd4s \
            -o "$GITHUB_WORKSPACE/postilla-release-keystore.jks.age" "$KEYSTORE_PATH"
          test -s "$GITHUB_WORKSPACE/postilla-release-keystore.jks.age"
          echo "Encrypted keystore created; plaintext will be removed automatically."

      - name: Upload encrypted keystore (one-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: postilla-release-keystore-age
          path: postilla-release-keystore.jks.age
          if-no-files-found: error
          retention-days: 1

      - name: Remove encrypted workspace copy
        if: always()
        run: rm -f postilla-release-keystore.jks.age
